server {
    listen 8080;
    access_log /var/log/alertsense/access.log combined;

    # IPs blocked by AlertSense (written by sensors/enforcer.py)
    include /etc/nginx/alertsense/blocklist.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
