# Practice lab: OWASP Juice Shop behind an Nginx proxy that writes a standard access log.
# The proxy uses host networking (more reliable inside Codespaces than container-to-container networking).
# Only attack systems you own or have written permission to test.
services:
  app:
    image: bkimminich/juice-shop
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/alertsense
      - ./blocklist:/etc/nginx/alertsense:ro
    depends_on:
      - app
