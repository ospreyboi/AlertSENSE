# Practice lab: DVWA behind an Nginx proxy that writes a standard access log.
# Only attack systems you own or have written permission to test.
services:
  db:
    image: mariadb:10
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dvwa
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: p@ssw0rd

  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    restart: unless-stopped
    environment:
      DB_SERVER: db
    depends_on:
      - db

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/alertsense
    depends_on:
      - dvwa
